<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica NutriVida - Agendar Cita</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    
    <header>
        <h1>Clínica NutriVida</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="citas.html">Agendar Cita</a>
            <a href="ficha.html">Mi Ficha</a>
            <a href="admin.html">Administración</a>
        </nav>
    </header>

    <!-- Seccion principal: Formulario de agendamiento -->
    <main>
        <section class="card-box" style="max-width: 600px; margin: 2rem auto;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Solicitud de Cita Nutricional</h2>
            
            <form id="form-cita">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="nutricionista">Nutricionista:</label>
                    <select id="nutricionista" required>
                        <option value="">-- Seleccionar Profesional --</option>
                        <option value="1">Dra. Camila Morales</option>
                        <option value="2">Dr. Felipe Reyes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="servicio">Servicio / Plan:</label>
                    <select id="servicio" required>
                        <option value="">-- Seleccionar Servicio --</option>
                        <option value="inicial">Consulta Nutricional Inicial ($35.000)</option>
                        <option value="control">Control Nutricional ($25.000)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de la Cita:</label>
                    <input type="date" id="fecha" required>
                </div>

                <button type="submit" style="width: 100%; padding: 12px; margin-top: 1rem; font-size: 1rem; font-weight: bold;">
                    Confirmar Cita
                </button>
            </form>
        </section>
    </main>

    
    <footer>
        <p>&copy; 2026 Clínica NutriVida - Temuco, Región de La Araucanía</p>
        <small>Atención presencial en sede Temuco</small>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
